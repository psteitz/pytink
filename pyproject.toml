[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytink"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mysql-connector-python==8.0.33",
    "numpy==1.26.4",
    "torch==2.9.1",
    "transformers==4.57.3",
    "pandas==2.3.3",
    "pyarrow==24.0.0",
    "tqdm==4.67.1",
    "matplotlib==3.10.8",
    "pyyaml",
    "yfinance==1.0",
]

[project.scripts]
pytink-train = "pytink.train_model:main"
pytink-infer = "pytink.inference:main"
pytink-farm  = "pytink.farming:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:google.protobuf.*",
]
